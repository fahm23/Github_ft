<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Tugas 2 - Data Pegawai</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        table,
        th,
        td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h2>Data Pegawai</h2>

    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
                <th>Total Gaji</th>
            </tr>
        </thead>

        <tbody id="data"></tbody>

        <tfoot>
            <tr>
                <th colspan="8">Total Keseluruhan</th>
                <th id="totalKeseluruhan"></th>
            </tr>
        </tfoot>
    </table>

    <script>
        // Data pegawai
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        // Gaji Pokok menggunakan if
        let gapok;
        if (jabatan === "Manajer") {
            gapok = 15000000;
        } else if (jabatan === "Asisten Manajer") {
            gapok = 10000000;
        } else {
            gapok = 5000000;
        }

        // Tunjangan Jabatan -> 15% dari gapok
        let tunjanganJabatan = 0.15 * gapok;

        // BPJS -> 10% dari gapok
        let bpjs = 0.10 * gapok;

        // Tunjangan Keluarga 
        let tunjanganKeluarga = (status === "Menikah") ? 0.20 * gapok : 0;

        // Total Gaji
        let totalGaji = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

        // ditampilkan ke tabel
        document.getElementById("data").innerHTML =
            "<tr>" +
            "<td>" + nama + "</td>" +
            "<td>" + umur + "</td>" +
            "<td>" + jabatan + "</td>" +
            "<td>" + status + "</td>" +
            "<td>" + gapok.toLocaleString() + "</td>" +
            "<td>" + tunjanganJabatan.toLocaleString() + "</td>" +
            "<td>" + bpjs.toLocaleString() + "</td>" +
            "<td>" + tunjanganKeluarga.toLocaleString() + "</td>" +
            "<td>" + totalGaji.toLocaleString() + "</td>" +
            "</tr>";

        document.getElementById("totalKeseluruhan").innerHTML =
            totalGaji.toLocaleString();
    </script>

</body>

</html>
